name: Deploy to GitHub Pages

on:
  # Every save in the CMS is a commit on main: rebuild and publish.
  push:
    branches: [main]
  # "Run workflow" button in the Actions tab (also fetches new HAL publications).
  workflow_dispatch:
  # Every Monday at 05:00 UTC: add new publications found on HAL, then publish.
  schedule:
    - cron: '0 5 * * 1'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Add new HAL publications
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          node scripts/sync-publications.mjs
          if [ -n "$(git status --porcelain src/content/publications)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/content/publications
            git commit -m "Ajout automatique des nouvelles publications HAL"
            git push || echo "Push skipped: the branch moved. The new publications will be added next run."
          fi

      - id: pages
        uses: actions/configure-pages@v6

      - name: Build site
        run: npm run build
        env:
          SITE_URL: ${{ steps.pages.outputs.origin }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
