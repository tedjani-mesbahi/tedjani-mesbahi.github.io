intro_fr: 'Depuis 2008, j’enseigne ce que je recherche : stocker, gérer et utiliser intelligemment l’énergie électrique. Des batteries et supercondensateurs aux systèmes hybrides et à la mobilité électrique, mes cours font entrer en classe les questions du laboratoire et les besoins de l’industrie. J’interviens à l’INSA Strasbourg, à l’ENIM Metz et à l’École Centrale de Nantes, où j’ai contribué au Master européen Erasmus Mundus E-PiCo, et j’ai créé le parcours d’ingénieur « Smart Manufacturing » enseigné en anglais pour préparer les étudiants à l’Industrie X.0. Hors de l’amphithéâtre, je coordonne la mobilité internationale et les doubles diplômes, afin que mes étudiants apprennent à travailler au-delà des frontières comme des disciplines.'
intro_en: 'Since 2008, I have taught what I research: how to store, manage and use electrical energy intelligently. From batteries and supercapacitors to hybrid energy systems and electric mobility, my courses bring the questions of the laboratory and the needs of industry straight into the classroom. I teach at INSA Strasbourg, ENIM Metz and École Centrale de Nantes, where I contributed to the Erasmus Mundus Joint Master E-PiCo, and I have created the English-taught “Smart Manufacturing” engineering track to prepare students for Industry X.0. Beyond the lecture hall, I coordinate international student mobility and double-degree exchanges, so that my students learn to work across borders as well as across disciplines.'
