      Mission : répondre à une question de conception souvent traitée en deux temps, dimensionner le stockage puis gérer son énergie, en résolvant les deux ensemble grâce à des modèles qui reproduisent le vieillissement réel des batteries et des supercondensateurs.
    detail_en: |-
      Thesis: Influence of management strategies of a hybrid source of an electric vehicle on its sizing and lifespan, by integrating a physical model., defended on 25 March 2016.
      Mission: to answer a design question that was often treated in two separate steps, sizing the storage and then managing its energy, by solving both together with models that capture how batteries and supercapacitors actually age.
