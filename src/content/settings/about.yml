bio_fr: |-
  Tedjani Mesbahi est Professeur des Universités en génie électrique à l’INSA Strasbourg et chercheur au laboratoire ICube (CNRS UMR 7357), il anime l’axe « Intégration système » de l’équipe EM3 et dirige l’équipe de recherche en génie électrique de l’INSA. Senior Member de l’IEEE, il est docteur de l’École Centrale de Lille (2016) et titulaire d’une Habilitation à Diriger des Recherches de l’Université de Strasbourg (2023).

  Ses recherches portent sur les systèmes de stockage hybrides (batteries, supercondensateurs, piles à combustible), la gestion intelligente des batteries et la gestion d’énergie pilotée par l’IA pour les véhicules électriques et hybrides. Il coordonne ENERGETIC, projet Horizon Europe de 5 M€ réunissant 14 partenaires de 7 pays, et a co-fondé la BMS Alliance Europe.

  Pour lui, la recherche n’a de sens que si elle atteint l’industrie : programmes de transfert avec la SATT Conectus, thèse CIFRE avec EDF R&D, chaire industrielle avec Eiffage. Sa technologie OptHySource a reçu le Prix national d’innovation i-PhD en 2022.

  Track Chair et Session Chair à l’IEEE VPPC, Associate Editor de _Energy and AI_ (Elsevier), il a encadré 13 doctorants et figure parmi les 2 % de chercheurs les plus cités au monde en énergie (Stanford/Elsevier).
bio_en: |-
  Tedjani Mesbahi a Full Professor of Electrical Engineering at INSA Strasbourg and researcher at the ICube laboratory (CNRS UMR 7357), he leads the “System Integration” axis of the EM3 team and heads INSA’s electrical engineering research team. A Senior Member of IEEE, he holds a Ph.D. from École Centrale de Lille (2016) and the Habilitation to Supervise Research from the University of Strasbourg (2023).

  His research covers hybrid energy storage (batteries, supercapacitors, fuel cells), intelligent battery management and AI-driven energy management for electric and hybrid vehicles. He coordinates ENERGETIC, a €5M Horizon Europe project with 14 partners from 7 countries, and co-founded the BMS Alliance Europe.

  For him, research only matters if it reaches industry: technology-transfer programmes with SATT Conectus, a CIFRE partnership with EDF R&D, an industrial chair with Eiffage. His OptHySource technology received the national i-PhD Innovation Award in 2022.

  Track Chair and Session Chair at IEEE VPPC and Associate Editor of _Energy and AI_ (Elsevier), he has supervised 13 Ph.D. students and is ranked among the top 2% of the world’s most-cited scientists in energy (Stanford/Elsevier).
