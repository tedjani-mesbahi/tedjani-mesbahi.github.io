# Parcours — modifiable dans le CMS (Pages > Parcours)
bio_fr: |-
  Tedjani Mesbahi est professeur des universités en génie électrique à l'INSA Strasbourg et chercheur au laboratoire ICube (CNRS UMR 7357), où il anime l'axe « intégration système » de l'équipe EM3 et coordonne l'équipe de recherche en génie électrique de l'INSA.

  Ses travaux portent sur les systèmes de stockage d'énergie pour la mobilité électrique : modélisation multiphysique des batteries lithium-ion et sodium-ion, sources hybrides batterie/supercondensateur, stratégies de gestion de l'énergie, et intelligence artificielle explicable pour estimer l'état de charge, l'état de santé et la durée de vie des batteries. Il s'intéresse aussi à la sécurité des batteries et à l'emballement thermique, en lien étroit avec les sapeurs-pompiers du Bas-Rhin (SIS 67).

  Il coordonne le projet européen ENERGETIC (Horizon Europe, 5 M€), après avoir dirigé scientifiquement le projet Interreg VEHICLE (2019–2022). Il a soutenu son habilitation à diriger des recherches en 2023 et a été élevé au grade de Senior Member de l'IEEE en 2024.
bio_en: |-
  Tedjani Mesbahi is a Full Professor of Electrical Engineering at INSA Strasbourg and a researcher at the ICube Laboratory (CNRS UMR 7357), where he leads the "system integration" research axis of the EM3 team and coordinates INSA's electrical engineering research team.

  His work focuses on energy storage for electric mobility: multiphysics modelling of lithium-ion and sodium-ion batteries, battery/supercapacitor hybrid sources, energy management strategies, and explainable artificial intelligence to estimate the state of charge, state of health and lifetime of batteries. He also works on battery safety and thermal runaway, in close partnership with the Bas-Rhin fire and rescue service (SIS 67).

  He coordinates the European project ENERGETIC (Horizon Europe, €5M), after serving as scientific lead of the Interreg project VEHICLE (2019–2022). He received his habilitation (HDR) in 2023 and was elevated to IEEE Senior Member in 2024.
