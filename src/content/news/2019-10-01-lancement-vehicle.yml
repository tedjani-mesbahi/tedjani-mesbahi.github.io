title_fr: Lancement du projet Interreg VEHICLE
title_en: Launch of the Interreg project VEHICLE
date: 2019-10-01
category: project
summary_fr: Porté par l'INSA Strasbourg avec 15 partenaires du Rhin supérieur, VEHICLE associe batteries Li-ion et supercondensateurs pour allonger la durée de vie des batteries de véhicules électriques.
summary_en: Led by INSA Strasbourg with 15 Upper Rhine partners, VEHICLE combines Li-ion batteries and supercapacitors to extend the life of electric-vehicle batteries.
