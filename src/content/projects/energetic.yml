title_fr: Systèmes de gestion de batteries de nouvelle génération fondés sur un jumeau numérique riche en données
title_en: Next-generation battery management systems based on a data-rich digital twin
summary_fr: Des batteries plus fiables, plus durables et plus sûres pour les transports électriques et le stockage stationnaire, grâce à l'IA explicable, aux modèles d'apprentissage hybrides et au calcul edge et cloud. Le projet a aussi doté l'INSA d'une plateforme de vieillissement de batteries.
summary_en: More reliable, longer-lasting and safer batteries for electric transport and stationary storage, using explainable AI, hybrid learning models and edge and cloud computing. The project also gave INSA a battery ageing platform.
